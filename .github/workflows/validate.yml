name: Validate

on:
  push:
  pull_request:

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Check for machine-specific paths
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Recurse -File | Select-String -Pattern 'C:\\Users\\[^<]' -ErrorAction SilentlyContinue
          if ($matches) {
            $matches | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
