<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Codex Usage Island preview</title>
  <desc id="desc">Compact and expanded views of the Codex Usage Island Windows overlay.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#background)"/>
  <text x="80" y="92" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Codex Usage Island</text>
  <text x="80" y="128" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Windows 上的 Codex 剩余额度悬浮窗</text>

  <g transform="translate(80 202)" filter="url(#shadow)">
    <rect width="450" height="76" rx="38" fill="#11141b"/>
    <text x="28" y="47" fill="#eef2f8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Codex</text>
    <text x="128" y="47" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">5H 34%</text>
    <rect x="223" y="26" width="2" height="25" rx="1" fill="#5eead4" opacity="0.8"/>
    <text x="245" y="47" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">7D 13%</text>
    <rect x="358" y="22" width="70" height="32" rx="16" fill="#214743"/>
    <text x="393" y="44" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">ACTIVE</text>
    <rect x="18" y="71" width="76" height="3" rx="2" fill="url(#accent)"/>
  </g>
  <text x="305" y="312" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="15">收起状态</text>

  <g transform="translate(670 162)" filter="url(#shadow)">
    <rect width="450" height="340" rx="38" fill="#11141b"/>
    <text x="28" y="48" fill="#eef2f8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Codex</text>
    <text x="128" y="48" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">5H 34%</text>
    <rect x="223" y="27" width="2" height="25" rx="1" fill="#5eead4" opacity="0.8"/>
    <text x="245" y="48" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">7D 13%</text>
    <rect x="358" y="23" width="70" height="32" rx="16" fill="#2d323e"/>
    <text x="393" y="45" text-anchor="middle" fill="#949eb2" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">IDLE</text>

    <rect x="18" y="80" width="414" height="104" rx="14" fill="#1b202b"/>
    <text x="38" y="112" fill="#eef2f8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">5 小时剩余</text>
    <text x="412" y="112" text-anchor="end" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">34%</text>
    <rect x="38" y="130" width="374" height="10" rx="5" fill="#323a4a"/>
    <rect x="38" y="130" width="127" height="10" rx="5" fill="url(#accent)"/>
    <text x="38" y="163" fill="#949eb2" font-family="Segoe UI, Arial, sans-serif" font-size="14">下一次重置时间 <tspan fill="#5eead4" font-size="15" font-weight="700">15:47</tspan>，还有 4 小时 12 分</text>

    <rect x="18" y="198" width="414" height="104" rx="14" fill="#1b202b"/>
    <text x="38" y="230" fill="#eef2f8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">每周剩余</text>
    <text x="412" y="230" text-anchor="end" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">13%</text>
    <rect x="38" y="248" width="374" height="10" rx="5" fill="#323a4a"/>
    <rect x="38" y="248" width="49" height="10" rx="5" fill="#fbbf24"/>
    <text x="38" y="281" fill="#949eb2" font-family="Segoe UI, Arial, sans-serif" font-size="14">下一次重置时间 06-25 10:58</text>

    <text x="28" y="326" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13">Codex 空闲</text>
  </g>
  <text x="895" y="530" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="15">展开状态</text>
</svg>
